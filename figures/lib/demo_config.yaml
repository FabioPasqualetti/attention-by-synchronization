# Only ts_d2 ships (models/TS_d2.pt); the other entries describe checkpoints that are
# regenerated by training and are not distributed. tinystories_demo.py uses ts_d2.
default_model: ts_d2
default_temperature: 0.7
max_gen_tokens: 15
context_window: 8
eos_tokens:
- .
- '!'
- '?'
- <eos>
ode_steps: 150
ode_dt: 0.04
ode_noise: 0.15
t_context: 0.4
t_init: 0.25
t_settle_base: 1.2
t_settle_scale: 1.2
t_predict: 0.7
t_between: 0.25
window_size:
- 1400
- 880
fps: 60
