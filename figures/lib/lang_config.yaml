# Model
d_model: 64
n_heads: 2
n_layers: 2
d_ff: 256
dropout: 0.1
max_seq_len: 50

# Kuramoto (identical to kws/)
n_ode_steps: 500
ode_dt: 0.05
d_osc: 2

# Training
lr: 5.0e-4
weight_decay: 1.0e-4
batch_size: 64
grad_clip: 1.0
scheduler: cosine

# SVA
sva_epochs: 20

# PTB
ptb_epochs: 30

# Seeds
seeds: [0, 1, 2]
